dungeon_name: "<gradient:#c084fc:#7c3aed>Malignant Marsh</gradient>"

dungeon_template_name: "malignant_marsh"

dungeon_key_item:
  material: "OMINOUS_TRIAL_KEY"
  name: "<gradient:#c084fc:#7c3aed>Keystone: %dungeon_name%</gradient>"
  lore:
    - "<gray>Place this key into the</gray>"
    - "<gold>%dungeon_name%</gold> <gray>keystone to begin.</gray>"
    - ""
    - "<gray>Portal Duration:</gray> <aqua>%open_duration% seconds</aqua>"
    - ""
    - "<dark_red>1 Use Only</dark_red>"
    - "<bold><light_purple>Legendary Dungeon Key</light_purple></bold>"


dungeon_portal_world: "world"

dungeon_portal_room:
  general_portal_room_region: "pos1=-542,62,-175 pos2=-533,69,-166"
  keystone_position: "pos=-540,64,-169"
  keystone_name: "<purple>Keystone</purple>"

dungeon_portal:
  entry_portal_region: "pos1=-536,64,-171 pos2=-536,66,-170"
  dungeon_spawn_position: "pos=-1420,63,56 rotation=0"
  exit_portal_region: "pos1=-1421,63,54 pos2=-1420,65,54"
  world_exit_position: "pos=-538,64,-170 rotation=90"
  open_duration_seconds: "60"

  on_open:
    - "SOUND sound=block.end_portal.spawn"
    - "MESSAGE message=<green>%dungeon_name% Portal has stabilised for <aqua>%open_duration%</aqua> seconds.</green>"

  on_close:
    - "SOUND sound=block.end_portal.spawn"
    - "MESSAGE message=<red>%dungeon_name% Portal has collapsed.</red>"

on_start:
  - "GRAVEYARD pos=-1395,67,54 rotation=45"
  - "WEATHER weather=rain"
  - "TIME time=7am"
  - "EVENT events=poisonwater,poisonvine"

