dungeon_name: "<red>Flat Test</red>"
dungeon_template_name: "flat_test"

dungeon_key_item:
  material: "OMINOUS_TRIAL_KEY"
  name: "<gold>Keystone: %dungeon_name%"
  lore:
    - "<red> Place this key into the %dungeon_name% keystone to start the Dungeon."
    - "1 use"
    - "Legendary Item"

dungeon_portal_world: "world"

dungeon_portal_room:
  general_portal_room_region: "pos1=x,y,z pos2=x,y,z"
  keystone_position: "pos=x,y,z"
  keystone_name: "<dark_purple>Keystone"

dungeon_portal:
  entry_portal_region: "pos1=117,155,-42 pos2=117,157,-43"
  dungeon_spawn_position: "pos=-16,-60,2 rotation=90"

  exit_portal_region: "pos1=-15,-60,0 pos2=-17,-58,0"
  world_exit_position: "pos=123,155,-43 rotation=90"

  open_duration_seconds: "30"

  on_open:
    - "SOUND sound=ITEM_GOAT_HORN_SOUND_0"
    - "MESSAGE message=<green>Dungeon portal has stablised for %open_duration%</green>"

  on_close:
    - "SOUND sound=ITEM_GOAT_HORN_SOUND_0"
    - "MESSAGE message=<red>Dungeon portal closed</red>"

default_graveyard: "pos=-42,-60,16"
# Default graveyard moved into on start - events, time, etc must also be set here!

on_start: []



dungeon_areas:

  room1:
    entry_bounds: "pos1=-16,-60,-3 pos2=-17,-58,-3"

    on_entry:
      - "MESSAGE message=<yellow>Entering room1</yellow>"
      - "SOUND sound=ITEM_GOAT_HORN_SOUND_0"
      - "MOB type=MOOSHROOM pos=-12,-60,-39 level=5 count=1 preset=NOXIOUS_CULTIVATOR riding=ZOMBIE_HORSE"

# - "MOB type=ZOMBIE pos=-25,-60,-10 level=2 count=2"
# - "MOB type=SKELETON pos=-25,-60,-10 level=22 count=2 preset=KNIGHT"
# - "MOB type=ILLUSIONER pos=-25,-60,-10 level=10 count=1 preset=ENCHANTER"

    on_clear:
      - "MESSAGE message=<green>Room cleared</green>"
      - "FILL block=AIR pos1=-15,-60,-27 pos2=-14,-59,-27"
    interactions:
      - pos: "-11,-59,-16"
        commands:
          - "MESSAGE message=<gold>button press</gold>"
          - "MOB type=ZOMBIE pos=21,-60,-13 level=5 count=1 preset=FIEND"
      - pos: "x,y,z"
        commands:
          - "abc"
          - "def"

    triggers: []

  room2:
    entry_bounds: "pos1=-16,-60,-29 pos2=-18,-58,-29"

    on_entry:
      - "MOB type=CREEPER pos=-12,-60,-39 level=5 count=1 preset=BEEHIVE_CREEPER"
      - "MOB type=COW pos=-12,-60,-39 level=5 count=1 preset=NOXIOUS_CULTIVATOR"
      - "MOB type=ZOMBIE pos=-12,-60,-39 level=6 count=1 preset=BRUISER armour=IRON_SILENCE_REDSTONE_2"
      - "MOB type=SKELETON pos=-12,-60,-39 level=6 count=1 preset=KNIGHT armour=COPPER_1"
      - "MOB type=ZOMBIE pos=-12,-60,-39 level=6 count=1 preset=FIEND weapon=IRON_SWORD,IRON_AXE"
      - "MOB type=SPIDER pos=-12,-60,-39 level=1 count=1"
    on_clear:
      - "MESSAGE message=<green> cleared whoo </green>"
      - "SOUND sound=GOAT_HORN_0"
      - "FILL pos1=-21,-60,-28 pos2=-21,-59,-29 block=AIR"
      - "MOB type=VILLAGER pos=-29,-60,-28 level=1 count=1 preset=VILLAGER"

    interactions: []

    triggers:
      - pos: "x,y,z"
        commands:
          - "MESSAGE message=<red>Something awakens beneath the ground</red>"
          - "SOUND sound=GOAT_HORN_0"
          - "MOB type=VILLAGER pos=-29,-60,-28 level=50 count=1 preset=VILLAGER"
