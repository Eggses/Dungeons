dungeon_template_name: "flat_test"

dungeon_portal:
  world_with_portal: "world"

  # Region format: pos1=x,y,z pos2=x,y,z
  entry_portal_region: "pos1=12,64,-40 pos2=40,85,-10" todo

  # Position format: pos=x,y,z
  dungeon_spawn_position: "pos=-16,60,2"

  exit_portal_region: "pos1=-15,-60,0 pos2=-17,-58,0"
  world_exit_location: "pos=50,51,-20" TODO

  open_duration_seconds: 30

  on_open:
    - "SOUND sound=GOAT_HORN_0"
    - "MESSAGE message=<green>Dungeon portal has stablised for 120 seconds!</green>"

  on_close:
    - "SOUND sound=GOAT_HORN_0"
    - "MESSAGE message=<red>Dungeon portal closed</red>"

dungeon_areas:

  room1:
    entry_bounds: "pos1=-16,-60,-3 pos2=-17,-58,-3"

    on_entry:
      - "MESSAGE message=<yellow>Entering room1</yellow>"
      - "SOUND sound=GOAT_HORN_0"
      - "MOB type=ZOMBIE pos=30,52,-5 level=3 count=3 preset=DEFAULT"
      - "MOB type=SKELETON pos=34,52,-6 level=3 count=2 preset=DEFAULT"

    on_clear:
      - "MESSAGE message=<green>Courtyard cleared</green>"
      - "FILL block=AIR pos1=20,51,-10 pos2=25,55,-5"
      - "GRAVEYARD pos=28,52,-2"

    interactions:
      - pos: "22,52,-8"
        commands:
          - "MESSAGE message=<aqua>You pressed the courtyard switch</aqua>"
          - "SOUND sound=GOAT_HORN_0"
          - "FILL block=REDSTONE_BLOCK pos1=22,52,-8 pos2=22,52,-8"

    triggers:
      - id: "courtyard_gate_open"
        commands:
          - "MESSAGE message=<gold>The courtyard gate opens</gold>"
          - "FILL block=AIR pos1=40,51,0 pos2=42,56,0"

  graveyard:
    entry_bounds: "pos1=85,50,-30 pos2=140,90,30"

    on_entry:
      - "MESSAGE message=<gray>Entering the graveyard</gray>"
      - "GRAVEYARD pos=100,52,0"
      - "MOB type=ZOMBIE pos=95,52,3 level=4 count=4 preset=DEFAULT"
      - "MOB type=SPIDER pos=102,52,-4 level=4 count=2 preset=DEFAULT"

    on_clear:
      - "MESSAGE message=<green>Graveyard cleared</green>"
      - "SOUND sound=GOAT_HORN_0"
      - "FILL block=TORCH pos1=98,52,0 pos2=98,52,0"

    interactions:
      - pos: "110,52,5"
        commands:
          - "MESSAGE message=<light_purple>You disturbed an ancient grave</light_purple>"
          - "SOUND sound=GOAT_HORN_0"
          - "MOB type=ZOMBIE pos=112,52,5 level=5 count=2 preset=DEFAULT"

    triggers:
      - id: "graveyard_boss_spawn"
        commands:
          - "MESSAGE message=<red>Something awakens beneath the ground</red>"
          - "SOUND sound=GOAT_HORN_0"
          - "MOB type=WITHER_SKELETON pos=120,52,0 level=8 count=1 preset=DEFAULT"
