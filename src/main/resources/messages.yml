# =========================================================
# Shared (used by all commands)
# =========================================================
shared:
  prefix:
    main: "<blue><bold>[Dungeons] </bold></blue>"
    error: "<dark_red><bold>Error: </bold></dark_red>"

  error:
    unknown_command: "%prefix_main%%prefix_error%<red>Unknown command.</red>"
    permission_fail: "%prefix_main%%prefix_error%<red>You do not have permission to use this command.</red>"
    unknown_syntax: "%prefix_main%%prefix_error%<red>Unknown command syntax.</red>"
    must_be_player: "%prefix_main%%prefix_error%<red>This command can only be used by a player.</red>"
    player_not_found: "%prefix_main%%prefix_error%<red>Player %target_player% not found.</red>"


# =========================================================
# /dungeons reload
# =========================================================
dungeons_reload:
  usage: "%prefix_main%%prefix_error%<red>Usage: /dungeons reload <all|messages|menus|dungeon_templates></red>"
  unknown_target: "%prefix_main%%prefix_error%<red>Unknown reload target: %reload_target%.</red>"
  reloaded: "%prefix_main%<green>Reloaded %reload_target%.</green>"

# =========================================================
# /dungeons destroy
# =========================================================
dungeons_destroy:
  usage: "%prefix_main%%prefix_error%<red>Usage: /dungeons destroy <all|target_instance></red>"
  invalid_dungeon_world: "%prefix_main%%prefix_error%<red>World %destroy_target% does not exist or is not a dungeon world.</red>"
  no_worlds_exist: "%prefix_main%%prefix_error%<red>No dungeon instances exist.</red>"
  requested: "%prefix_main%<green>Dungeon world(s) %destroy_target% scheduled for destruction.</green>"

# =========================================================
# /dungeons give <type> [Player]
# =========================================================
dungeons_give:
  usage: "%prefix_main%%prefix_error%<red>Usage: /dungeons give <type> <key> [player]</red>"
  unknown_type: "%prefix_main%%prefix_error%<red>Unknown type: %give_type%.</red>"
  unknown_key: "%prefix_main%%prefix_error%<red>Unknown key: %give_key%.</red>"
  given: "%prefix_main%<green>Given %give_type% to %target_player%.</green>"

# =========================================================
# Keystone / mechanics
# =========================================================
keystone:
  disabled: "%prefix_main%%prefix_error%<red>This keystone has no energy.</red>"

# =========================================================
# Banned Items
# =========================================================
banned_items:
  allowed_to_enter: "%prefix_main%<green>You are allowed to enter this Dungeon.</green>"
  denied_to_enter: "%prefix_main%%prefix_error%<red>You are unable to enter this Dungeon with these items:</red> <dark_red>%banned_items%</dark_red>"

# =========================================================
# /dungeons stats
# =========================================================
dungeons_stats:
  usage: "%prefix_main%%prefix_error%<red>Usage: /dungeons stats [player]</red>"