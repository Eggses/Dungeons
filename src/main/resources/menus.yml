keystone_menu:
  title: "<gradient:#8b0000:#c91f1f:#ff3b3b:#b11212><bold>Keystone: %dungeon_name%"
  items:
    info:
      material: "BOOK"
      name: "<aqua><bold>Keystone Information</bold></aqua>"
      lore:
        - "<gray>A keystone is required to</gray>"
        - "<gray>open this dungeon portal.</gray>"
        - ""
        - "<gray>Insert a <bold>%dungeon_name%</bold></gray>"
        - "<gray>keystone into the slot above.</gray>"
        - "<gray>the map to begin the Dungeon.</gray>"
        - ""
        - "<gray>The portal will open only if</gray>"
        - "<gray>the keystone matches this dungeon.</gray>"

    panel:
      material: "GRAY_STAINED_GLASS_PANE"
      name: ""
      lore: []

    open_portal:
      material: "PURPLE_STAINED_GLASS"
      name: "<gradient:#9b5cff:#d7b3ff><bold>Open Portal</bold></gradient>"
      lore:
        - "<gray>Click this to open the dungeon portal.</gray>"
        - "<gray>The portal will remain open for</gray>"
        - "<gray><bold>%open_duration%</bold> seconds.</gray>"

    invalid_key:
      material: "RED_STAINED_GLASS"
      name: "<red><bold>Invalid Key</bold></red>"
      lore:
        - "<gray>This item cannot be used</gray>"
        - "<gray>to open the dungeon portal.</gray>"

    insert_key:
      material: "MAP"
      name: "<red><bold>Insert Key Above</bold></red>"
      lore:
        - "<gray>Place a valid dungeon key</gray>"
        - "<gray>into the slot above.</gray>"

    check_inventory:
      material: "BOOK"
      name: "<gold><bold>Check Inventory</bold></gold>"
      lore:
      - "<gray>Click to check your inventory for banned items.</gray>"
      - "<gray>You will be informed if you have any banned items after.</gray>"

    close:
      material: "BARRIER"
      name: "<red><bold>Close</bold></red>"
      lore:
        - "<gray>Click to close this menu.</gray>"

stats_menu:
  title: "<blue><bold>Dungeon Stats</bold><blue>"

  items:
    info:
      material: "PLAYER_HEAD"
      name: "<bold><gradient:#00c6ff:#0072ff>Dungeon Stats: %target%</bold>"
      lore:
        - ""
        - "<gray>View this player's dungeon performance.</gray>"
    malignant_marsh:
      material: "LILY_PAD"
      name: "<bold>%dungeon_name%</bold>"
      lore:
        - ""
        - "<gray>Best Time: %best_time%</gray>"
        - "<gray>Completions: %completions%</gray>"
    close:
      material: "BARRIER"
      name: "<red><bold>Close</bold></red>"
      lore:
        - "<gray>Click to close this menu.</gray>"
    panel:
      material: "GRAY_STAINED_GLASS_PANE"
      name: ""
      lore: []